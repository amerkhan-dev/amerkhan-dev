name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main] # redraw right away when the profile changes
  workflow_dispatch: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # GitHub's own contribution greens (light + dark), with a brass snake to match the banner
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#D4A03C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D4A03C&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
