<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Amer Khan — Software and AI Engineer">
  <rect width="1200" height="260" fill="#0B0A09"/>

  <!-- anchor rule -->
  <rect x="40" y="52" width="2" height="88" fill="#D4A03C" opacity="0.85"/>

  <!-- eyebrow -->
  <text x="64" y="72"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="3.4" fill="#D4A03C" opacity="0.92">SOFTWARE &amp; AI ENGINEER</text>

  <!-- name -->
  <text x="62" y="128"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.8" fill="#F0EADD">Amer Khan</text>

  <!-- tagline -->
  <text x="64" y="167"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="19" fill="#A29A8E">I build AI agents that survive contact with real users.</text>

  <!-- meta -->
  <text x="64" y="207"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12.5" letter-spacing="1.2" fill="#6E675D">UCONN CSE + MATH &#183; TWINLY CORE TEAM &#183; GREATER BOSTON</text>

  <!-- routed trace: orthogonal pathing, CAD/agent-run vernacular -->
  <g fill="none" stroke-width="1.6" stroke-linecap="square">
    <!-- completed legs -->
    <path d="M820 130 H860 V90 H900" stroke="#D4A03C" opacity="0.75"/>
    <path d="M900 90 H940 V160 H980" stroke="#D4A03C" opacity="0.75"/>
    <!-- pending legs -->
    <path d="M980 160 H1020 V110 H1060" stroke="#332E26"/>
    <path d="M1060 110 H1098 V130 H1136" stroke="#332E26"/>
  </g>

  <g>
    <circle cx="820" cy="130" r="4.5" fill="#D4A03C"/>
    <circle cx="900" cy="90" r="4.5" fill="#D4A03C"/>
    <circle cx="980" cy="160" r="4.5" fill="#D4A03C"/>
    <circle cx="1060" cy="110" r="5" fill="#0B0A09" stroke="#D4A03C" stroke-width="1.8"/>
    <circle cx="1136" cy="130" r="3.5" fill="#3E382F"/>
  </g>

  <text x="1136" y="200" text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" letter-spacing="2.4" fill="#4A443B">AGENT RUN &#8212; TRACED</text>
</svg>
